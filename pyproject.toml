[project]
name = "stl-to-step-converter"
version = "0.1.0"
description = "Convert mechanical STL meshes into STEP CAD models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.6,<3",
  "fastapi>=0.116,<1",
  "networkx>=3.5,<4",
  "numpy>=2.0,<3",
  "pillow>=11,<13",
  "point-cloud-utils>=0.34,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "rtree>=1.4,<2",
  "scipy>=1.15,<2",
  "shapely>=2.1,<3",
  "trimesh>=4.7,<5",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "runs", "web/dist", "web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
